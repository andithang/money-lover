<h1 mat-dialog-title>{{data.title}}</h1>
<div mat-dialog-content>
    <div class="confirm-deletion-content" [innerHTML]="data.message | translate: data.messageParams || {}"></div>
</div>
<div mat-dialog-actions align="end">
    <button mat-button (click)="close()">Đóng</button>
    <button mat-button [mat-dialog-close]="isConfirmed" color="accent">Đồng ý</button>
</div>
